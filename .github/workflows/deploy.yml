name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT || 22 }}
      CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
      CPANEL_NODEVENV: ${{ secrets.CPANEL_NODEVENV }}
      CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for key in CPANEL_HOST CPANEL_USERNAME CPANEL_SSH_KEY CPANEL_APP_PATH CPANEL_NODEVENV; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack release
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.env' \
            --exclude='./.next' \
            --exclude='./node_modules' \
            --exclude='./public/uploads' \
            -czf "$RUNNER_TEMP/mayonity-release.tar.gz" .
          cp "$RUNNER_TEMP/mayonity-release.tar.gz" "$GITHUB_WORKSPACE/mayonity-release.tar.gz"

      - name: Upload and build on cPanel
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/cpanel_deploy
          chmod 600 ~/.ssh/cpanel_deploy
          SSH_OPTS="-i $HOME/.ssh/cpanel_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          scp -P "${CPANEL_PORT}" $SSH_OPTS mayonity-release.tar.gz "${CPANEL_USERNAME}@${CPANEL_HOST}:/tmp/mayonity-release.tar.gz"
          ssh -p "${CPANEL_PORT}" $SSH_OPTS "${CPANEL_USERNAME}@${CPANEL_HOST}" \
            "set -e; mkdir -p '${CPANEL_APP_PATH}'; tar -xzf /tmp/mayonity-release.tar.gz -C '${CPANEL_APP_PATH}'; chmod +x '${CPANEL_APP_PATH}/scripts/cpanel-build.sh'; '${CPANEL_APP_PATH}/scripts/cpanel-build.sh' '${CPANEL_APP_PATH}' '${CPANEL_NODEVENV}'; rm -f /tmp/mayonity-release.tar.gz"
